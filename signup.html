<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | VeltaraX</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-page">

    <main class="auth-card">

        <a href="login.html" class="logo auth-logo">
            <span class="logo-icon">V</span>
            <span>Veltara<span class="logo-highlight">X</span></span>
        </a>

        <h1>Create your account</h1>
        <p class="auth-subtitle">Sign up to get access to your dashboard.</p>

        <!-- Error message area (filled in by auth.js) -->
        <div class="form-error" id="formError"></div>

        <!-- The form sends its data to signup.php (we build that next) -->
        <form id="signupForm" action="signup.php" method="POST">

            <div class="form-group">
                <label for="fullName">Full name</label>
                <input type="text" id="fullName" name="full_name"
                    placeholder="Your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email"
                    placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password"
                        placeholder="At least 8 characters" minlength="8" required>
                    <button type="button" class="toggle-password" data-target="password"
                        aria-label="Show or hide password">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" name="confirm_password"
                        placeholder="Type the password again" minlength="8" required>
                    <button type="button" class="toggle-password" data-target="confirmPassword"
                        aria-label="Show or hide password">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="auth-button">Create account</button>

        </form>

        <p class="auth-switch">
            Already have an account? <a href="login.html">Log in</a>
        </p>

    </main>

    <script src="auth.js"></script>
</body>
</html>
