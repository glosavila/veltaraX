<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | VeltaraX</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-page">

    <main class="auth-card">

        <a href="login.html" class="logo auth-logo">
            <span class="logo-icon">V</span>
            <span>Veltara<span class="logo-highlight">X</span></span>
        </a>

        <h1>Welcome back</h1>
        <p class="auth-subtitle">Log in to open your dashboard.</p>

        <!-- Error / success message area (filled in by auth.js) -->
        <div class="form-error" id="formError"></div>

        <!-- The form sends its data to login.php (we build that next) -->
        <form id="loginForm" action="#" method="POST">

            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email"
                    placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password"
                        placeholder="Your password" required>
                    <button type="button" class="toggle-password" data-target="password"
                        aria-label="Show or hide password">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="auth-button">Log in</button>

        </form>

        <p class="auth-switch">
            New here? <a href="signup.html">Create an account</a>
        </p>

    </main>

    <script src="auth.js"></script>
</body>
</html>
